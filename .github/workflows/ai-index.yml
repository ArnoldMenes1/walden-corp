name: Generate AI Index

on:
  push:
    branches: [main]
    paths:
      - 'foundation/**'
      - 'knowledge/**'
      - 'policies/**'
      - 'decisions/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/generate-ai-index.ts
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta/ai-index.md meta/search-index.json
          git diff --staged --quiet || git commit -m "chore(meta): regenerate ai-index"
          git push
