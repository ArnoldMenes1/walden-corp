name: Validate Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'meta/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/validate-docs.ts
