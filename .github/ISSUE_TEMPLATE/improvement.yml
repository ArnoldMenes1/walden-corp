name: 🔧 Amélioration
description: Proposer une amélioration d'un élément existant
title: "[Improvement] "
labels: ["improvement", "triage"]
body:
  - type: input
    id: target
    attributes:
      label: Élément concerné
      placeholder: "Ex. : foundation/standards/accessibility.md"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Situation actuelle
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Amélioration proposée
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Justification
    validations:
      required: true
